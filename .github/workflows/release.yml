name: Release

# Tag a commit (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build and publish the
# installer to GitHub Releases. Can also be run manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = "${{ github.event.inputs.version }}"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - name: Test
        run: dotnet test tests\MusicDraft.Tests\MusicDraft.Tests.csproj -c Release --nologo

      - name: Publish app (self-contained win-x64)
        run: >
          dotnet publish src\MusicDraft.App\MusicDraft.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true -p:DebugType=none
          -p:AllowedReferenceRelatedFileExtensions=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DSourceDir=..\publish" `
            "installer\MusicDraft.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDraftSetup-${{ steps.ver.outputs.version }}
          path: artifacts\MusicDraftSetup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts\MusicDraftSetup-*.exe
          generate_release_notes: true
          draft: true
